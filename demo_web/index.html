<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YZF智能助手</title>
<style>
  :root {
    --bg: #061522;
    --bg-deep: #081d2b;
    --card: rgba(12, 34, 48, .92);
    --card-solid: #0d2433;
    --card-raised: #112b3b;
    --text: #f2f8fa;
    --muted: #91a7b6;
    --brand: #21dfb5;
    --brand-strong: #18c9a4;
    --brand-soft: rgba(33, 223, 181, .12);
    --border: rgba(142, 194, 209, .17);
    --border-strong: rgba(33, 223, 181, .32);
    --warn: rgba(255, 180, 70, .12);
    --warn-border: rgba(255, 180, 70, .35);
    --shadow: 0 18px 46px rgba(0, 0, 0, .26);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html {
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    background: #04111b;
  }
  body {
    margin: 0; color: var(--text);
    background:
      radial-gradient(circle at 92% 5%, rgba(23, 201, 164, .16), transparent 30%),
      radial-gradient(circle at 0% 42%, rgba(37, 104, 145, .14), transparent 34%),
      linear-gradient(160deg, #071a28 0%, var(--bg) 50%, #05131f 100%);
    position: fixed;
    top: var(--app-top, 0);
    left: 0;
    right: 0;
    width: 100%;
    height: var(--app-height, 100dvh);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    background: rgba(6, 21, 34, .82);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(142, 194, 209, .12);
    padding: 13px 16px; display: flex; align-items: center; gap: 11px;
    z-index: 5; flex: 0 0 auto;
  }
  header .brand-mark {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 13px;
    display: grid; place-items: center;
    color: #03251f;
    background: linear-gradient(145deg, #3bf0ca, #10b995);
    box-shadow: 0 8px 24px rgba(33, 223, 181, .2);
  }
  header .brand-copy { display: flex; flex-direction: column; min-width: 0; }
  header b { font-size: 16px; line-height: 1.35; }
  header .subtitle {
    color: var(--muted); font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; line-height: 1.4;
  }
  header .tag {
    margin-left: auto; font-size: 10px; color: var(--brand);
    background: var(--brand-soft); border: 1px solid var(--border-strong);
    padding: 4px 9px; border-radius: 999px; letter-spacing: .08em;
  }
  #chat {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 16px 14px 4px;
  }
  .msg { display: flex; margin-bottom: 16px; }
  .msg .bubble {
    max-width: 88%; padding: 11px 14px; border-radius: 18px;
    white-space: normal; word-break: break-word;
  }
  .assistant .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-top-left-radius: 7px; max-width: 96%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
  }
  .user { justify-content: flex-end; }
  .user .bubble {
    background: linear-gradient(145deg, #3af1c9, #12bd9b);
    color: #03251f; border-top-right-radius: 7px;
    box-shadow: 0 10px 26px rgba(15, 192, 157, .16);
  }
  .meta { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    border: 1px solid var(--border-strong); background: var(--brand-soft);
    color: var(--brand); padding: 8px 12px; border-radius: 999px;
    font-size: 13px; cursor: pointer;
  }
  .chip:active { transform: scale(.98); }
  .welcome {
    padding: 10px 2px 20px;
  }
  .welcome-kicker {
    color: var(--brand); font-size: 11px; font-weight: 700;
    letter-spacing: .14em; margin-bottom: 8px;
  }
  .welcome h1 {
    margin: 0; font-size: 27px; line-height: 1.32; letter-spacing: -.02em;
    font-weight: 650;
  }
  .welcome h1 span { color: var(--brand); }
  .welcome p {
    color: var(--muted); margin: 9px 0 0; max-width: 340px;
    font-size: 14px;
  }
  .welcome-note {
    display: flex; align-items: center; gap: 8px; margin-top: 14px;
    padding: 9px 11px; border-radius: 12px;
    color: #9fb3bf; font-size: 11.5px;
    background: rgba(33, 223, 181, .065);
    border: 1px solid rgba(33, 223, 181, .14);
  }
  .welcome-note svg { color: var(--brand); flex: 0 0 auto; }
  .suggest {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px; margin: 18px 0 18px;
  }
  .suggest button {
    min-height: 96px; padding: 13px 12px; text-align: left;
    display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(155deg, rgba(18, 46, 62, .95), rgba(9, 30, 44, .95));
    border: 1px solid var(--border); color: var(--text);
    border-radius: 17px; font-size: 13px; cursor: pointer;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .14);
  }
  .suggest button:active {
    transform: scale(.985); border-color: var(--border-strong);
  }
  .suggest-icon {
    width: 30px; height: 30px; border-radius: 10px;
    display: grid; place-items: center; color: var(--brand);
    background: var(--brand-soft); margin-bottom: 9px;
  }
  .suggest-title { font-weight: 650; font-size: 14px; }
  .suggest-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .cards {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 9px; margin: 10px 0 12px;
  }
  .metric {
    background: linear-gradient(150deg, rgba(20, 53, 69, .9), rgba(10, 31, 45, .9));
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 11px;
  }
  .metric .k { color: var(--muted); font-size: 12px; }
  .metric .v { color: var(--brand); font-weight: 650; font-size: 18px; }
  .rich-text h2 {
    font-size: 18px; line-height: 1.45; margin: 2px 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .rich-text h3 {
    font-size: 15px; line-height: 1.5; margin: 17px 0 8px;
    padding-left: 10px; border-left: 3px solid var(--brand);
    color: #eaf8f6;
  }
  .rich-text p { margin: 7px 0; }
  .rich-text ul {
    margin: 5px 0 9px; padding-left: 20px;
  }
  .rich-text li { margin: 3px 0; }
  .rich-text .report-summary {
    display: inline-block; margin: 2px 0 8px; padding: 4px 9px;
    border-radius: 999px; background: rgba(33, 223, 181, .12);
    color: var(--brand);
    font-size: 13px; font-weight: 600;
  }
  .rich-text .core-summary {
    margin: 3px 0 12px; padding: 9px 10px; border-radius: 10px;
    background: rgba(20, 53, 69, .72); border: 1px solid var(--border);
    color: #cfe1e8; font-size: 13px; line-height: 1.65;
  }
  .rich-text .result-line {
    display: inline-block; margin-top: 8px; padding: 3px 9px;
    border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .rich-text .result-line.ok {
    color: var(--brand); background: rgba(33, 223, 181, .12);
  }
  .rich-text .result-line.warn {
    color: #ffc56d; background: rgba(255, 180, 70, .12);
  }
  .rich-text .result-detail {
    margin: 3px 0; padding-left: 10px; color: var(--muted);
    font-size: 12px; line-height: 1.55;
  }
  .rich-text .report-hr {
    border: 0; border-top: 1px solid var(--border); margin: 12px 0;
  }
  .table-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 8px 0 12px; border: 1px solid var(--border);
    border-radius: 13px; background: rgba(7, 27, 40, .76);
  }
  .data-table {
    width: max-content; min-width: 100%; border-collapse: collapse;
    font-size: 12px; line-height: 1.45;
  }
  .data-table th, .data-table td {
    padding: 8px 10px; border-bottom: 1px solid rgba(142, 194, 209, .12);
    white-space: nowrap; text-align: left;
  }
  .data-table th {
    position: sticky; top: 0; background: #102b3b;
    color: var(--brand); font-weight: 600;
  }
  .data-table tr:last-child td { border-bottom: 0; }
  .data-table tbody tr:nth-child(even) { background: rgba(20, 53, 69, .42); }
  details {
    margin-top: 10px; font-size: 12px; color: var(--muted);
    background: rgba(7, 27, 40, .5); border: 1px solid var(--border);
    border-radius: 11px; padding: 8px 10px;
  }
  details summary { cursor: pointer; }
  .feedback { display: flex; gap: 10px; margin-top: 8px; font-size: 16px; }
  .feedback span { cursor: pointer; opacity: .55; }
  .feedback span:hover { opacity: 1; }
  footer {
    background: rgba(5, 20, 31, .94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(142, 194, 209, .12);
    padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
    flex: 0 0 auto;
  }
  .disclaimer {
    font-size: 10.5px; color: #718b9a; margin-top: 7px; text-align: center;
  }
  .composer { display: flex; gap: 8px; }
  #input {
    flex: 1; border: 1px solid var(--border); border-radius: 12px;
    /* iOS 在输入框字号 <16px 时会自动放大页面，这里必须保持 16px */
    padding: 10px 12px; font-size: 16px; line-height: 1.5;
    outline: none; background: #0d2433; color: var(--text);
    touch-action: manipulation;
  }
  #input::placeholder { color: #6f8795; }
  #input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(33,223,181,.08); }
  #send {
    border: 0; background: linear-gradient(145deg, #3bf0ca, #10b995);
    color: #03251f; border-radius: 12px; width: 48px;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  .typing { color: var(--brand); font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
    background: rgba(4, 18, 28, .92); color: #fff; padding: 8px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (min-width: 640px) {
    body {
      width: min(100%, 520px); left: 50%; right: auto;
      transform: translateX(-50%);
      border-left: 1px solid rgba(142, 194, 209, .1);
      border-right: 1px solid rgba(142, 194, 209, .1);
      box-shadow: 0 0 60px rgba(0, 0, 0, .32);
    }
  }
  @media (max-width: 520px) {
    #chat { padding-left: 10px; padding-right: 10px; }
    .assistant .bubble { width: 100%; max-width: 100%; padding: 11px 12px; }
    .rich-text h2 { font-size: 17px; }
    .rich-text h3 { font-size: 14px; margin-top: 15px; }
    .rich-text .core-summary { font-size: 12.5px; }

    /* 手机上把宽表拆成逐行指标卡，避免横向拖动和列挤压。 */
    .table-wrap {
      overflow: visible; border: 0; background: transparent;
      margin: 8px 0 13px;
    }
    .data-table {
      display: block; width: 100%; min-width: 0;
      border-collapse: separate; font-size: 13px;
    }
    .data-table thead { display: none; }
    .data-table tbody { display: block; }
    .data-table tbody tr {
      display: block; margin: 0 0 8px; padding: 5px 11px;
      background: rgba(14, 39, 54, .9) !important;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .data-table tbody td {
      display: grid; grid-template-columns: minmax(86px, 40%) minmax(0, 1fr);
      gap: 12px; width: 100%; padding: 6px 0;
      border: 0; border-bottom: 1px dashed rgba(142, 194, 209, .13);
      white-space: normal; overflow-wrap: anywhere;
    }
    .data-table tbody td::before {
      content: attr(data-label);
      color: var(--muted); font-size: 12px; font-weight: 600;
    }
    .data-table tbody td:last-child { border-bottom: 0; }
  }
</style>
</head>
<body>
<header>
  <span class="brand-mark" aria-hidden="true">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
      <path d="M4 13.2h2.2l1.6-4.8 2.4 9 2.1-7.1 1.6 4.3H20"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="brand-copy">
    <b>YZF智能助手</b>
    <span class="subtitle">YZFTOOLS · DEVICE CARE</span>
  </span>
  <span class="tag">AI</span>
</header>

<main id="chat">
  <section class="welcome">
    <div class="welcome-kicker">YZFTOOLS AI ASSISTANT</div>
    <h1>让设备使用更简单，<br><span>让数据更容易理解。</span></h1>
    <p>可以询问产品操作、模式设置和指标含义，也可以结合治疗记录生成报告、查看变化。</p>
    <div class="welcome-note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3 5 6v5c0 4.7 2.8 8.1 7 10 4.2-1.9 7-5.3 7-10V6l-7-3Z"
              stroke="currentColor" stroke-width="1.8"/>
        <path d="m9.2 12 1.8 1.8 3.8-4"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      仅用于设备使用参考，不替代医生诊断
    </div>
  </section>

  <div class="suggest">
    <button data-q="YA70工作原理是什么？">
      <span class="suggest-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M7 4v6m0 4v6m10-16v3m0 4v9M4 10h6M14 7h6M4 17h6"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="suggest-title">设备原理</span>
      <span class="suggest-sub">YA70工作原理是什么？</span>
    </button>
    <button data-q="有什么工作模式？">
      <span class="suggest-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="suggest-title">工作模式</span>
      <span class="suggest-sub">有什么工作模式？</span>
    </button>
    <button data-q="帮我生成一份报告">
      <span class="suggest-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M6 3h9l3 3v15H6V3Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9 11h6M9 15h6M9 7h3" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="suggest-title">治疗报告</span>
      <span class="suggest-sub">帮我生成一份报告</span>
    </button>
    <button data-q="帮我分析一下这一周的数据">
      <span class="suggest-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 18V9m5 9V5m5 13v-6m5 6V7" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="suggest-title">数据分析</span>
      <span class="suggest-sub">帮我分析一下这一周的数据</span>
    </button>
  </div>
</main>

<footer>
  <form id="composer" class="composer">
    <input id="input" placeholder="向 YZF 智能助手提问…"
           autocomplete="off" enterkeyhint="send">
    <button id="send" type="submit" aria-label="发送">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 12 14-7-4.5 14-3-5.5L5 12Z"
              stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
  <div class="disclaimer">设备使用参考，不构成医疗诊断 · 参数调整请遵医嘱</div>
</footer>
<div id="toast" class="toast"></div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const composerEl = document.getElementById('composer');
const toastEl = document.getElementById('toast');

function syncMobileViewport() {
  const viewport = window.visualViewport;
  const height = viewport ? viewport.height : window.innerHeight;
  const offsetTop = viewport ? viewport.offsetTop : 0;
  document.documentElement.style.setProperty(
    '--app-height', Math.round(height) + 'px'
  );
  document.documentElement.style.setProperty(
    '--app-top', Math.round(offsetTop) + 'px'
  );
}

syncMobileViewport();
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncMobileViewport);
  window.visualViewport.addEventListener('scroll', syncMobileViewport);
}
window.addEventListener('resize', syncMobileViewport);
window.addEventListener('orientationchange', () => {
  setTimeout(syncMobileViewport, 120);
});
inputEl.addEventListener('focus', () => {
  setTimeout(syncMobileViewport, 120);
});

const stored = localStorage.getItem('sleepagent_session');
const sessionId = stored || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
localStorage.setItem('sleepagent_session', sessionId);

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function formatInline(text) {
  return escapeHtml(text || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function formatPlain(text) {
  return formatInline(text).replace(/\n/g, '<br>');
}

function polishReportText(text) {
  const units = '(分钟|次\\/小时|次\\/分钟|L\\/min|hPa|mL|分)';
  return String(text || '')
    .replace(new RegExp('([+-]?\\d+)\\.0(?=\\s*' + units + ')', 'g'), '$1')
    .replace(new RegExp('([+-]?\\d+(?:\\.\\d+)?)(' + units + ')', 'g'), '$1 $2');
}

function stripInternalValidation(text) {
  return String(text || '').split('\n').filter(line => {
    const value = line.trim();
    return !/^验收结果：/.test(value)
      && !/^·\s*(pressure|respiratory-events|breathing-overview|leakage)：/.test(value)
      && !/^(模型调用失败|模型输出未通过校验|未启用大模型)/.test(value);
  }).join('\n').trim();
}

function stripInlineSources(text) {
  return String(text || '')
    .replace(/根据《[^》]+》[^，。；\n]*[，；]\s*/g, '')
    .replace(/出处为《[^》]+》[^；。\n]*[；。]?/g, '')
    .replace(/（[^（）]*(?:出处|来源)[^（）]*）/g, '')
    .replace(/\([^()]*(?:出处|来源)[^()]*\)/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function publicDetail(detail) {
  const value = String(detail || '').trim();
  return /模型调用失败|模型输出未通过校验|未启用大模型|验收(通过|未通过)/.test(value)
    ? ''
    : value;
}

function splitTableRow(line) {
  return line.trim()
    .replace(/^\|/, '')
    .replace(/\|$/, '')
    .split('|')
    .map(cell => cell.trim());
}

function isTableSeparator(line) {
  if (!line.includes('|')) return false;
  const cells = splitTableRow(line);
  return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
}

function renderMarkdown(text) {
  const lines = polishReportText(text).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let listTag = '';
  let i = 0;

  function closeList() {
    if (listTag) {
      out.push(`</${listTag}>`);
      listTag = '';
    }
  }

  function openList(tag) {
    if (listTag !== tag) {
      closeList();
      listTag = tag;
      out.push(`<${tag}>`);
    }
  }

  while (i < lines.length) {
    const raw = lines[i];
    const line = raw.trim();
    if (!line) {
      closeList();
      i += 1;
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length
        && isTableSeparator(lines[i + 1])) {
      closeList();
      const headers = splitTableRow(line);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
        rows.push(splitTableRow(lines[i]));
        i += 1;
      }
      const head = headers.map(cell => `<th>${formatInline(cell)}</th>`).join('');
      const body = rows.map(row =>
        '<tr>' + headers.map((_, index) =>
          `<td data-label="${escapeHtml(headers[index] || '')}">${
            formatInline(row[index] || '')}</td>`).join('') + '</tr>'
      ).join('');
      out.push(
        `<div class="table-wrap"><table class="data-table">`
        + `<thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`
      );
      continue;
    }

    if (/^[一二三四五六七八九十]+、/.test(line)
        || line === '数据范围与边界') {
      closeList();
      out.push(`<h3>${formatInline(line)}</h3>`);
      i += 1;
      continue;
    }

    if (/^【.+】$/.test(line)) {
      closeList();
      out.push(`<h3>${formatInline(line.slice(1, -1))}</h3>`);
      i += 1;
      continue;
    }

    if (/(报告|数据分析|评分分析|报告解读)[（(]/.test(line)) {
      closeList();
      out.push(`<h2>${formatInline(line)}</h2>`);
      i += 1;
      continue;
    }

    if (/^总体评级：/.test(line)) {
      closeList();
      out.push(`<div class="report-summary">${formatInline(line)}</div>`);
      i += 1;
      continue;
    }

    if (/^核心指标：/.test(line)) {
      closeList();
      out.push(`<div class="core-summary">${formatInline(line)}</div>`);
      i += 1;
      continue;
    }

    if (/^验收结果：/.test(line)) {
      closeList();
      const passed = line.includes('通过') && !line.includes('未通过');
      out.push(
        `<div class="result-line ${passed ? 'ok' : 'warn'}">${formatInline(line)}</div>`
      );
      i += 1;
      continue;
    }

    if (/^={3,}$/.test(line) || /^-{8,}$/.test(line)) {
      closeList();
      out.push('<hr class="report-hr">');
      i += 1;
      continue;
    }

    const bullet = line.match(/^-\s+(.*)$/);
    if (bullet) {
      openList('ul');
      out.push(`<li>${formatInline(bullet[1])}</li>`);
      i += 1;
      continue;
    }

    const numbered = line.match(/^\d+\.\s+(.*)$/);
    if (numbered) {
      openList('ol');
      out.push(`<li>${formatInline(numbered[1])}</li>`);
      i += 1;
      continue;
    }

    if (/^·\s+/.test(line)) {
      closeList();
      out.push(`<p class="result-detail">${formatInline(line)}</p>`);
      i += 1;
      continue;
    }

    closeList();
    out.push(`<p>${formatInline(line)}</p>`);
    i += 1;
  }
  closeList();
  return `<div class="rich-text">${out.join('')}</div>`;
}

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function isNearBottomElement(element, threshold = 80) {
  return element.scrollHeight - element.scrollTop - element.clientHeight < threshold;
}

function isNearBottom() {
  return isNearBottomElement(chatEl);
}

function scrollMessageToStart(wrap) {
  requestAnimationFrame(() => {
    const containerTop = chatEl.getBoundingClientRect().top;
    const messageTop = wrap.getBoundingClientRect().top;
    const target = chatEl.scrollTop + messageTop - containerTop - 8;
    chatEl.scrollTop = Math.max(0, target);
  });
}

function addMessage(role, html, scrollMode = 'none') {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  if (scrollMode === 'bottom') {
    chatEl.scrollTop = chatEl.scrollHeight;
  } else if (scrollMode === 'start') {
    scrollMessageToStart(wrap);
  }
  return bubble;
}

function renderMetrics(structured) {
  const cards = (structured && structured.core_metric_cards) || [];
  if (!cards.length) return '';
  const items = cards.map(card => `
    <div class="metric">
      <div class="k">${escapeHtml(card.label || card.key || '')}</div>
      <div class="v">${escapeHtml(card.display || '未提供')}</div>
    </div>`).join('');
  return `<div class="cards">${items}</div>`;
}

function renderResponse(data, question, scrollMode = 'start') {
  let html = renderMarkdown(stripInlineSources(stripInternalValidation(data.text)));
  if (data.structured) html = renderMetrics(data.structured) + html;

  if (data.sources && data.sources.length) {
    html += `<details><summary>查看来源</summary>${escapeHtml(data.sources.join('、'))}</details>`;
  }
  const detail = publicDetail(data.detail);
  html += `<div class="meta">${escapeHtml(data.mode || '')}${detail ? ' · ' + escapeHtml(detail) : ''}</div>`;

  if (data.candidates && data.candidates.length) {
    html += '<div class="chips">' + data.candidates.map((item, index) =>
      `<button class="chip" data-value="${escapeHtml(item.value || item.title || '')}">${
        escapeHtml(item.title || item.value || '')}</button>`).join('') + '</div>';
  }

  html += `<div class="feedback" data-request="${escapeHtml(data.request_id || '')}"
    data-question="${escapeHtml(question || '')}"
    data-answer="${escapeHtml((data.text || '').slice(0, 800))}"
    data-mode="${escapeHtml(data.mode || '')}">
    <span data-rating="up" title="有帮助">👍</span>
    <span data-rating="down" title="没帮助">👎</span>
  </div>`;

  const bubble = addMessage('assistant', html, scrollMode);
  bindInteractive(bubble);
}

function bindInteractive(container) {
  container.querySelectorAll('.chip').forEach(button => {
    button.addEventListener('click', () => send(button.dataset.value));
  });
  container.querySelectorAll('.feedback span').forEach(span => {
    span.addEventListener('click', () => {
      fetch('/api/feedback', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          request_id: span.parentElement.dataset.request,
          rating: span.dataset.rating,
          session_id: sessionId,
          question: span.parentElement.dataset.question,
          answer: span.parentElement.dataset.answer,
          mode: span.parentElement.dataset.mode
        })
      }).then(() => toast('感谢反馈'));
    });
  });
}

document.querySelectorAll('.suggest button').forEach(button => {
  button.addEventListener('click', () => send(button.dataset.q));
});

function removeTyping(bubble) {
  const wrap = bubble && bubble.closest('.msg');
  if (wrap) wrap.remove();
}

async function consumeChatStream(response, typing, message) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let receivedFinal = false;

  try {
    while (true) {
      const {value, done} = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), {stream: !done});

      let boundary;
      while ((boundary = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);
        if (!block || block.startsWith(':')) continue;

        let event = 'message';
        const dataLines = [];
        block.split('\n').forEach(line => {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        });
        if (!dataLines.length) continue;

        let data;
        try {
          data = JSON.parse(dataLines.join('\n'));
        } catch (error) {
          continue;
        }

        if (event === 'status') {
          typing.textContent = data.text || '正在处理…';
        } else if (event === 'message') {
          const anchorResponse = isNearBottom();
          removeTyping(typing);
          renderResponse(data, message, anchorResponse ? 'start' : 'none');
          receivedFinal = true;
        } else if (event === 'error') {
          removeTyping(typing);
          addMessage(
            'assistant',
            formatPlain(data.message || '服务暂时不可用，请稍后再试。'),
            'start',
          );
          return true;
        }
      }

      if (done) break;
    }
  } catch (error) {
    if (receivedFinal) return true;
    throw error;
  }
  return receivedFinal;
}

async function sendWithJson(message, typing) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message, session_id: sessionId})
  });
  const payload = await response.json();
  const anchorResponse = isNearBottom();
  removeTyping(typing);
  if (!payload || payload.code !== 0) {
    addMessage(
      'assistant', formatPlain('服务暂时不可用，请稍后再试。'),
      anchorResponse ? 'start' : 'none',
    );
  } else {
    renderResponse(payload.data, message, anchorResponse ? 'start' : 'none');
  }
}

async function send(message) {
  message = (message || '').trim();
  if (!message || sendEl.disabled) return;
  addMessage('user', formatPlain(message), 'bottom');
  inputEl.value = '';
  inputEl.blur();          // 发送后收起键盘，用户点输入框时才重新弹出
  sendEl.disabled = true;
  const typing = addMessage(
    'assistant', '<span class="typing">思考中…</span>', 'bottom'
  );

  try {
    const response = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, session_id: sessionId})
    });
    const contentType = response.headers.get('content-type') || '';
    if (!response.ok || !contentType.includes('text/event-stream')
        || !response.body) {
      await sendWithJson(message, typing);
    } else {
      const completed = await consumeChatStream(response, typing, message);
      if (!completed) {
        removeTyping(typing);
        addMessage(
          'assistant',
          formatPlain('回答中断，请稍后重试。'),
          'start',
        );
      }
    }
  } catch (error) {
    removeTyping(typing);
    addMessage(
      'assistant',
      formatPlain('网络异常，请检查连接后重试。'),
      'start',
    );
  } finally {
    sendEl.disabled = false;
  }
}

composerEl.addEventListener('submit', event => {
  event.preventDefault();
  if (event.isComposing) return;
  send(inputEl.value);
});
</script>
